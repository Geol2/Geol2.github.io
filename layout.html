<!--
  index.html 의 #app 자리에 통째로 삽입되는 조각(partial).
  여기에는 doctype / html / head / body 를 넣지 않는다. (index.html 이 문서 껍데기를 담당)
-->
<div class="site">

  <!-- 상단 헤더 -->
  <header class="site-header navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="/">Geol Diary</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#site-nav" aria-controls="site-nav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="site-nav">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" href="/" data-nav="home">Home</a>
        </li>
        <li class="nav-item active">
          <a class="nav-link" href="javascript:void(0);" id="retrospective" data-retrospective="active">retrospec</a>
        </li>
      </ul>
      <form class="form-inline my-2 my-lg-0" id="search-form" onsubmit="return false;">
        <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search">
        <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
      </form>
    </div>
  </header>

  <main class="site-main" role="main">
    <div class="layout">

      <!-- 왼쪽: 프로필 + 목차 -->
      <aside class="sidebar">
        <div class="card">
          <img src="./public/images/profile.jpg" class="card-img-top" alt="GEOL">
          <div class="card-body">
            <div class="card-title">GEOL</div>
            <p class="card-text">Hello, World!</p>
          </div>
        </div>

        <div class="sidebar-title" id="index-title">
          <span>Index List</span>
          <button type="button" class="btn btn-sm sidebar-toggle" aria-label="Toggle index">+/-</button>
        </div>
        <nav class="sidebar-nav" aria-label="Index">
          <ul class="index-tree" id="index-tree"></ul>
        </nav>
      </aside>

      <!-- 오른쪽: 본문 (사이드바 클릭 시 이 영역만 교체된다) -->
      <section class="content">
        <h1 class="content-title" id="content-title">Home</h1>
        <div class="content-body dos-myungjo" id="content-body"></div>
      </section>

    </div>
  </main>

</div>

<!-- 첫 화면(Home). 본문 영역에 그대로 렌더된다. -->
